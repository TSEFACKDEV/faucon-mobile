<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FAUCON — Suivi GPS de conteneurs</title>

<!-- Police -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Leaflet -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

<style>
  /* ===========================================================
     1. TOKENS — palette, typographie, ombres
     =========================================================== */
  :root{
    --forest:      #1E6B50;
    --forest-dark: #16543E;
    --forest-tint: #E4F1EA; /* fond vert très clair pour les états actifs */
    --orange:      #D48B11;
    --orange-glow: rgba(212,139,17,.35);
    --white:       #FFFFFF;
    --gray-light:  #F5F5F5;
    --gray-mid:    #E7E7E7;
    --blue-light:  #CFE8F5;
    --text-main:   #16211C;
    --text-muted:  #77837D;
    --shadow-soft: 0 4px 16px rgba(20,30,25,.08);
    --shadow-card: 0 8px 24px rgba(20,30,25,.10);
    --radius-lg:   22px;
    --radius-md:   16px;
    --radius-sm:   10px;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    font-family:'Inter',system-ui,sans-serif;
    color:var(--text-main);
    background:var(--gray-light);
  }
  button{ font-family:inherit; border:none; background:none; cursor:pointer; }
  h1,h2,h3,p{ margin:0; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
  }

  /* ===========================================================
     2. STRUCTURE GÉNÉRALE
     =========================================================== */
  #app{
    position:relative;
    width:100%; height:100vh; height:100dvh;
    max-width:520px; margin:0 auto;
    overflow:hidden;
    background:var(--white);
  }

  #map{
    position:absolute; inset:0;
    filter:saturate(.92) brightness(1.03);
    transition:opacity .35s ease;
  }
  #map.fading{ opacity:0; }

  /* légère grille discrète superposée à la carte, non interactive */
  .map-grid-overlay{
    position:absolute; inset:0; pointer-events:none; z-index:390;
    background-image:
      linear-gradient(rgba(30,60,50,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(30,60,50,.035) 1px, transparent 1px);
    background-size:38px 38px;
    mix-blend-mode:multiply;
  }

  /* ===========================================================
     3. BARRE SUPÉRIEURE
     =========================================================== */
  .top-bar{
    position:absolute; top:0; left:0; right:0; z-index:500;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:18px 16px 0;
    pointer-events:none;
  }
  .top-bar > *{ pointer-events:auto; }

  .top-left{ display:flex; flex-direction:column; gap:8px; }

  .logo-card{
    display:flex; align-items:center; gap:8px;
    background:var(--white);
    padding:10px 16px;
    border-radius:18px;
    box-shadow:var(--shadow-soft);
    width:fit-content;
  }
  .logo-card .logo-mark{
    width:22px; height:22px; color:var(--forest);
    display:flex; align-items:center; justify-content:center;
  }
  .logo-card .logo-text{
    font-weight:800; font-size:16px; letter-spacing:.4px;
    color:var(--forest-dark);
  }

  .status-badge{
    display:flex; align-items:center; gap:6px;
    background:var(--white);
    padding:7px 12px;
    border-radius:14px;
    box-shadow:var(--shadow-soft);
    width:fit-content;
    font-size:12.5px; font-weight:600; color:var(--text-main);
  }
  .status-badge .icon{ width:14px; height:14px; color:var(--orange); }
  .status-badge .pulse-dot{
    width:6px;height:6px;border-radius:50%;background:var(--forest);
    animation:softpulse 1.8s ease-in-out infinite;
  }

  .map-toggle{
    display:flex; background:var(--white);
    border-radius:14px; padding:4px;
    box-shadow:var(--shadow-soft);
    position:relative;
  }
  .toggle-btn{
    position:relative; z-index:2;
    padding:8px 14px; font-size:12.5px; font-weight:600;
    border-radius:10px; color:var(--text-muted);
    transition:color .3s ease;
    white-space:nowrap;
  }
  .toggle-btn.active{ color:var(--white); }
  .toggle-slider{
    position:absolute; top:4px; left:4px; bottom:4px;
    width:calc(50% - 4px);
    background:var(--forest-dark);
    border-radius:10px;
    transition:transform .32s cubic-bezier(.4,0,.2,1);
    z-index:1;
  }
  .map-toggle[data-mode="satellite"] .toggle-slider{ transform:translateX(100%); }

  /* ===========================================================
     4. CONTRÔLES DE ZOOM
     =========================================================== */
  .zoom-controls{
    position:absolute; right:14px; top:50%; transform:translateY(-90px);
    z-index:500; display:flex; flex-direction:column;
    background:var(--white); border-radius:16px; overflow:hidden;
    box-shadow:var(--shadow-soft);
  }
  .zoom-btn{
    width:44px; height:44px;
    display:flex; align-items:center; justify-content:center;
    font-size:20px; font-weight:600; color:var(--forest-dark);
    position:relative; overflow:hidden;
  }
  .zoom-btn:first-child{ border-bottom:1px solid var(--gray-mid); }
  .zoom-btn:active{ background:var(--gray-light); }

  /* ===========================================================
     5. MARQUEURS CONTENEURS (Leaflet divIcon)
     =========================================================== */
  .container-marker{ position:relative; }
  .marker-pulse{
    position:absolute; top:50%; left:50%;
    width:22px; height:22px; margin:-11px 0 0 -11px;
    border-radius:50%; background:var(--orange-glow);
    animation:markerpulse 2.2s ease-out infinite;
  }
  .marker-dot{
    position:absolute; top:50%; left:50%;
    width:20px; height:20px; margin:-10px 0 0 -10px;
    border-radius:50%;
    background:var(--orange);
    border:3px solid var(--white);
    box-shadow:0 3px 8px rgba(20,20,20,.28);
    transition:box-shadow .3s ease, transform .3s ease;
  }
  .container-marker.selected .marker-dot{
    transform:scale(1.15);
    box-shadow:0 0 0 6px rgba(212,139,17,.28), 0 0 0 12px rgba(212,139,17,.12), 0 3px 10px rgba(20,20,20,.3);
  }
  .container-marker.selected .marker-pulse{ animation-duration:1.4s; }

  @keyframes markerpulse{
    0%{ transform:scale(1); opacity:.65; }
    75%{ transform:scale(2.6); opacity:0; }
    100%{ transform:scale(2.6); opacity:0; }
  }
  @keyframes softpulse{
    0%,100%{ opacity:1; } 50%{ opacity:.35; }
  }

  /* transition douce de déplacement des marqueurs (glissement GPS) */
  .leaflet-marker-icon{ transition:transform 1.6s linear; }
  .leaflet-zoom-anim .leaflet-marker-icon{ transition:none; }

  /* ===========================================================
     6. BOTTOM SHEET
     =========================================================== */
  .bottom-sheet{
    position:absolute; left:0; right:0; bottom:66px;
    height:72vh; max-height:640px;
    background:var(--white);
    border-radius:26px 26px 0 0;
    box-shadow:0 -8px 30px rgba(20,30,25,.14);
    z-index:600;
    display:flex; flex-direction:column;
    transform:translateY(var(--sheet-y, 420px));
    touch-action:none;
  }
  .bottom-sheet.is-dragging{ transition:none; }
  .bottom-sheet:not(.is-dragging){ transition:transform .38s cubic-bezier(.32,.72,0,1); }

  .sheet-drag-zone{ padding-top:10px; cursor:grab; }
  .sheet-handle{
    width:40px; height:5px; border-radius:3px;
    background:var(--gray-mid); margin:0 auto 14px;
  }
  .sheet-header{
    display:flex; align-items:baseline; justify-content:space-between;
    padding:0 20px 14px;
  }
  .sheet-header h2{ font-size:17px; font-weight:700; }
  .sheet-header .sheet-count{
    font-size:12.5px; font-weight:600; color:var(--text-muted);
    background:var(--gray-light); padding:4px 10px; border-radius:20px;
  }

  .device-list{
    flex:1; overflow-y:auto; padding:0 16px 8px;
    display:flex; flex-direction:column; gap:10px;
    -webkit-overflow-scrolling:touch;
  }

  .device-card{
    display:flex; align-items:flex-start; gap:12px;
    padding:14px; border-radius:var(--radius-md);
    background:var(--gray-light);
    border:1.5px solid transparent;
    transition:transform .22s ease, box-shadow .22s ease, background .22s ease, border-color .22s ease;
  }
  .device-card:active{ transform:scale(.98); }
  .device-card:hover{ transform:translateY(-2px); box-shadow:var(--shadow-card); }
  .device-card.active{
    background:var(--forest-tint);
    border-color:rgba(30,107,80,.25);
  }

  .device-card .pin{
    flex-shrink:0; width:38px; height:38px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    background:var(--white); color:var(--orange);
    box-shadow:var(--shadow-soft);
  }
  .device-card .pin svg{ width:19px; height:19px; }

  .device-card .info{ flex:1; min-width:0; }
  .device-card .info .name{ font-size:14.5px; font-weight:700; margin-bottom:3px; }
  .device-card .info .meta{
    font-size:12.5px; color:var(--text-muted); display:flex; align-items:center;
    flex-wrap:wrap; gap:5px; line-height:1.5;
  }
  .device-card .info .meta .dot{ opacity:.5; }
  .device-card .info .meta .status-pill{
    font-weight:700;
  }
  .device-card .info .meta .status-pill.moving{ color:var(--forest); }
  .device-card .info .meta .status-pill.transit{ color:var(--orange); }
  .device-card .info .meta .status-pill.stopped{ color:#8a8a8a; }
  .device-card .info .updated{
    font-size:11.5px; color:#9aa39d; margin-top:5px;
    display:flex; align-items:center; gap:4px;
  }
  .device-card .info .updated svg{ width:11px; height:11px; }

  .device-card .battery{
    flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:3px;
    font-size:11px; font-weight:700; color:var(--text-muted);
  }
  .device-card .battery svg{ width:18px; height:18px; }
  .device-card .battery.low{ color:#C24444; }
  .device-card .battery.low svg{ color:#C24444; }

  .add-device-btn{
    margin:6px 16px 16px; padding:14px;
    display:flex; align-items:center; justify-content:center; gap:8px;
    background:var(--white); color:var(--forest-dark);
    border:1.6px dashed var(--gray-mid);
    border-radius:var(--radius-md);
    font-weight:700; font-size:14px;
    position:relative; overflow:hidden;
    transition:background .2s ease, border-color .2s ease;
  }
  .add-device-btn:active{ background:var(--forest-tint); border-color:var(--forest); }
  .add-device-btn svg{ width:18px; height:18px; }

  /* ===========================================================
     7. NAVIGATION INFÉRIEURE
     =========================================================== */
  .bottom-nav{
    position:absolute; left:0; right:0; bottom:0; z-index:700;
    height:66px; background:var(--white);
    box-shadow:0 -2px 14px rgba(20,30,25,.08);
    display:flex; align-items:stretch;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .nav-item{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:3px; color:var(--text-muted);
    position:relative; overflow:hidden;
  }
  .nav-item .nav-icon-wrap{
    width:38px; height:26px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    transition:background .28s cubic-bezier(.4,0,.2,1), transform .28s cubic-bezier(.4,0,.2,1);
  }
  .nav-item svg{ width:20px; height:20px; transition:color .25s ease; }
  .nav-item .nav-label{ font-size:10.5px; font-weight:600; transition:color .25s ease; }
  .nav-item.active .nav-icon-wrap{ background:var(--forest-tint); transform:translateY(-1px); }
  .nav-item.active svg, .nav-item.active .nav-label{ color:var(--forest); }

  /* ===========================================================
     8. PANNEAU PLACEHOLDER (autres onglets)
     =========================================================== */
  .tab-overlay{
    position:absolute; inset:0; bottom:66px; z-index:650;
    background:var(--white);
    transform:translateY(12px); opacity:0; pointer-events:none;
    transition:transform .32s cubic-bezier(.32,.72,0,1), opacity .28s ease;
    display:flex; flex-direction:column;
  }
  .tab-overlay.visible{ transform:translateY(0); opacity:1; pointer-events:auto; }
  .tab-overlay .tab-header{
    padding:22px 20px 14px; font-size:20px; font-weight:800;
    border-bottom:1px solid var(--gray-mid);
  }
  .tab-overlay .tab-body{ padding:16px 20px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; }
  .tab-placeholder-row{
    display:flex; align-items:center; gap:12px;
    padding:14px; background:var(--gray-light); border-radius:var(--radius-md);
    color:var(--text-muted); font-size:13.5px; font-weight:600;
  }
  .tab-placeholder-row svg{ width:18px; height:18px; color:var(--forest); flex-shrink:0; }

  /* ===========================================================
     9. RIPPLE générique
     =========================================================== */
  .ripple-span{
    position:absolute; border-radius:50%;
    background:rgba(0,0,0,.14);
    transform:scale(0); animation:rippleAnim .55s ease-out;
    pointer-events:none;
  }
  @keyframes rippleAnim{ to{ transform:scale(2.6); opacity:0; } }

  .leaflet-control-attribution{ display:none; }
</style>
</head>
<body>

<div id="app">

  <!-- CARTE -->
  <div id="map"></div>
  <div class="map-grid-overlay"></div>

  <!-- BARRE SUPÉRIEURE -->
  <div class="top-bar">
    <div class="top-left">
      <div class="logo-card">
        <span class="logo-mark" id="logoIcon"></span>
        <span class="logo-text">FAUCON</span>
      </div>
      <div class="status-badge">
        <span class="pulse-dot"></span>
        <span id="activeCount">5 actifs</span>
      </div>
    </div>

    <div class="map-toggle" id="mapToggle" data-mode="map">
      <div class="toggle-slider"></div>
      <button class="toggle-btn active" data-mode="map">Carte</button>
      <button class="toggle-btn" data-mode="satellite">Satellite</button>
    </div>
  </div>

  <!-- ZOOM -->
  <div class="zoom-controls">
    <button class="zoom-btn" id="zoomIn">+</button>
    <button class="zoom-btn" id="zoomOut">−</button>
  </div>

  <!-- BOTTOM SHEET -->
  <div class="bottom-sheet" id="bottomSheet">
    <div class="sheet-drag-zone" id="sheetDragZone">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <h2>Dispositifs à proximité</h2>
        <span class="sheet-count" id="deviceCount">5 au total</span>
      </div>
    </div>
    <div class="device-list" id="deviceList"></div>
    <button class="add-device-btn" id="addDeviceBtn"></button>
  </div>

  <!-- OVERLAYS DES AUTRES ONGLETS -->
  <div class="tab-overlay" id="tab-devices">
    <div class="tab-header">Dispositifs</div>
    <div class="tab-body" id="tabDevicesBody"></div>
  </div>
  <div class="tab-overlay" id="tab-history">
    <div class="tab-header">Historique</div>
    <div class="tab-body">
      <div class="tab-placeholder-row"></div>
      <div class="tab-placeholder-row"></div>
      <div class="tab-placeholder-row"></div>
    </div>
  </div>
  <div class="tab-overlay" id="tab-alerts">
    <div class="tab-header">Alertes</div>
    <div class="tab-body">
      <div class="tab-placeholder-row"></div>
      <div class="tab-placeholder-row"></div>
    </div>
  </div>
  <div class="tab-overlay" id="tab-profile">
    <div class="tab-header">Profil</div>
    <div class="tab-body">
      <div class="tab-placeholder-row"></div>
    </div>
  </div>

  <!-- NAVIGATION -->
  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-item active" data-tab="map"><span class="nav-icon-wrap"></span><span class="nav-label">Carte</span></button>
    <button class="nav-item" data-tab="devices"><span class="nav-icon-wrap"></span><span class="nav-label">Dispositifs</span></button>
    <button class="nav-item" data-tab="history"><span class="nav-icon-wrap"></span><span class="nav-label">Historique</span></button>
    <button class="nav-item" data-tab="alerts"><span class="nav-icon-wrap"></span><span class="nav-label">Alertes</span></button>
    <button class="nav-item" data-tab="profile"><span class="nav-icon-wrap"></span><span class="nav-label">Profil</span></button>
  </nav>

</div>

<script>
/* =====================================================================
   ICÔNES — mini librairie SVG inline au style "lucide" (stroke 2px)
   ===================================================================== */
const ICONS = {
  falcon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 L4 14 L12 11 L20 14 Z"/><path d="M12 11 L12 22"/></svg>`,
  activity: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="2 14 8 14 10 6 14 20 17 10 22 10"/></svg>`,
  mapPin: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.1 7-11.5A7 7 0 0 0 5 9.5C5 14.9 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.4"/></svg>`,
  battery: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="17" height="10" rx="2"/><line x1="22" y1="10.5" x2="22" y2="13.5"/></svg>`,
  clock: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>`,
  plus: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
  map: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/></svg>`,
  package: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5V8z"/><polyline points="3 8 12 13 21 8"/><line x1="12" y1="13" x2="12" y2="22"/></svg>`,
  bell: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>`,
  user: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>`
};

/* =====================================================================
   DONNÉES — flotte de conteneurs (simulation)
   ===================================================================== */
const containers = [
  { id:'4821', name:'Container 4821', status:'moving',  speed:47, battery:82, updated:2,
    path:[[43.296,5.370],[43.24,4.9],[43.05,4.3],[42.6,3.6],[41.9,3.1],[41.38,2.17]] },
  { id:'3390', name:'Container 3390', status:'transit', speed:32, battery:65, updated:6,
    path:[[43.30,5.36],[43.55,6.8],[43.9,8.2],[44.41,8.93]] },
  { id:'1187', name:'Container 1187', status:'stopped',  speed:0,  battery:91, updated:14,
    path:[[41.38,2.17],[41.38,2.17]] },
  { id:'5502', name:'Container 5502', status:'moving',  speed:55, battery:44, updated:1,
    path:[[43.70,7.27],[43.55,6.9],[43.30,5.9],[43.10,5.3],[42.7,4.4]] },
  { id:'2264', name:'Container 2264', status:'transit', speed:28, battery:77, updated:4,
    path:[[43.13,5.93],[43.20,5.6],[43.29,5.37]] },
];

const STATUS_LABEL = { moving:'En mouvement', transit:'En transit', stopped:'À l\u2019arrêt' };
const STATUS_CLASS = { moving:'moving', transit:'transit', stopped:'stopped' };

/* =====================================================================
   CARTE — initialisation Leaflet
   ===================================================================== */
const map = L.map('map', {
  zoomControl:false,
  attributionControl:false,
  center:[42.9, 4.6],
  zoom:7,
  minZoom:3,
  maxZoom:15,
  zoomAnimation:true,
  zoomSnap:0.25
});

const lightLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  subdomains:'abcd', maxZoom:19
}).addTo(map);

const satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom:19
});

/* Petit fond bleu clair pour évoquer la mer, sous les tuiles (visible sur zoom faible) */
document.getElementById('map').style.background = '#CFE8F5';

/* Routes maritimes — courbes blanches semi-transparentes */
function curvedLine(a, b, bend = 0.18){
  const [lat1, lng1] = a, [lat2, lng2] = b;
  const midLat = (lat1+lat2)/2, midLng = (lng1+lng2)/2;
  const dx = lat2-lat1, dy = lng2-lng1;
  const ctrlLat = midLat - dy*bend;
  const ctrlLng = midLng + dx*bend;
  const pts = [];
  for(let t=0; t<=1; t+=0.04){
    const lat = (1-t)*(1-t)*lat1 + 2*(1-t)*t*ctrlLat + t*t*lat2;
    const lng = (1-t)*(1-t)*lng1 + 2*(1-t)*t*ctrlLng + t*t*lng2;
    pts.push([lat,lng]);
  }
  return pts;
}
const routes = [
  [[43.296,5.370],[41.38,2.17]],
  [[43.296,5.370],[44.41,8.93]],
  [[43.70,7.27],[43.13,5.93]],
];
routes.forEach(([a,b])=>{
  L.polyline(curvedLine(a,b), { color:'#ffffff', weight:7, opacity:.55, lineCap:'round', lineJoin:'round' }).addTo(map);
  L.polyline(curvedLine(a,b), { color:'#ffffff', weight:2.4, opacity:.9, lineCap:'round' }).addTo(map);
});

/* Marqueurs conteneurs */
const markerIcon = () => L.divIcon({
  className:'container-marker',
  html:`<div class="marker-pulse"></div><div class="marker-dot"></div>`,
  iconSize:[26,26], iconAnchor:[13,13]
});

const markerRefs = {};
containers.forEach(c=>{
  const m = L.marker(c.path[0], { icon:markerIcon() }).addTo(map);
  m.on('click', ()=> selectContainer(c.id));
  markerRefs[c.id] = m;
  c._pathIndex = 0;
});

let selectedId = null;
function selectContainer(id){
  selectedId = id;
  Object.entries(markerRefs).forEach(([cid, m])=>{
    const el = m.getElement();
    if(!el) return;
    el.classList.toggle('selected', cid === id);
  });
  const c = containers.find(x=>x.id===id);
  if(c){
    map.flyTo(markerRefs[id].getLatLng(), Math.max(map.getZoom(), 9), { duration:.9 });
  }
  renderDeviceList();
}

/* Simulation du déplacement en temps réel */
setInterval(()=>{
  containers.forEach(c=>{
    if(c.status === 'stopped') return;
    c._pathIndex = (c._pathIndex + 1) % c.path.length;
    const next = c.path[c._pathIndex];
    markerRefs[c.id].setLatLng(next);
    c.speed = Math.max(15, Math.min(65, c.speed + (Math.random()*10-5) | 0));
    c.battery = Math.max(5, c.battery - (Math.random() < .5 ? 1 : 0));
    c.updated = 0;
  });
  containers.forEach(c=>{ c.updated += 1; });
  renderDeviceList();
}, 3200);

/* =====================================================================
   TOGGLE CARTE / SATELLITE
   ===================================================================== */
const mapToggle = document.getElementById('mapToggle');
const mapEl = document.getElementById('map');
mapToggle.querySelectorAll('.toggle-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const mode = btn.dataset.mode;
    if(mode === mapToggle.dataset.mode) return;
    mapToggle.dataset.mode = mode;
    mapToggle.querySelectorAll('.toggle-btn').forEach(b=> b.classList.toggle('active', b===btn));

    mapEl.classList.add('fading');
    setTimeout(()=>{
      if(mode === 'satellite'){ map.removeLayer(lightLayer); map.addLayer(satLayer); }
      else { map.removeLayer(satLayer); map.addLayer(lightLayer); }
      mapEl.classList.remove('fading');
    }, 260);
  });
});

document.getElementById('zoomIn').addEventListener('click', ()=> map.zoomIn(0.6));
document.getElementById('zoomOut').addEventListener('click', ()=> map.zoomOut(0.6));

/* =====================================================================
   LISTE DES DISPOSITIFS
   ===================================================================== */
const deviceList = document.getElementById('deviceList');
const tabDevicesBody = document.getElementById('tabDevicesBody');

function deviceCardHTML(c){
  const low = c.battery <= 25;
  const timeLabel = c.updated < 1 ? 'à l\u2019instant' : `il y a ${c.updated} minute${c.updated>1?'s':''}`;
  return `
    <div class="device-card ${c.id===selectedId?'active':''}" data-id="${c.id}">
      <div class="pin">${ICONS.mapPin}</div>
      <div class="info">
        <div class="name">${c.name}</div>
        <div class="meta">
          <span class="status-pill ${STATUS_CLASS[c.status]}">${STATUS_LABEL[c.status]}</span>
          <span class="dot">•</span>
          <span>${c.speed} km/h</span>
          <span class="dot">•</span>
          <span>Batterie ${c.battery}%</span>
        </div>
        <div class="updated">${ICONS.clock} Dernière mise à jour : ${timeLabel}</div>
      </div>
      <div class="battery ${low?'low':''}">${ICONS.battery}${c.battery}%</div>
    </div>`;
}

function renderDeviceList(){
  const html = containers.map(deviceCardHTML).join('');
  deviceList.innerHTML = html;
  tabDevicesBody.innerHTML = html;
  document.getElementById('deviceCount').textContent = `${containers.length} au total`;
  document.getElementById('activeCount').textContent = `${containers.length} actifs`;

  [deviceList, tabDevicesBody].forEach(container=>{
    container.querySelectorAll('.device-card').forEach(card=>{
      card.addEventListener('click', ()=> selectContainer(card.dataset.id));
    });
  });
}
renderDeviceList();

/* =====================================================================

   ===================================================================== */
const navItems = document.querySelectorAll('.nav-item');
const tabOverlays = { devices:'tab-devices', history:'tab-history', alerts:'tab-alerts', profile:'tab-profile' };

navItems.forEach(item=>{

    navItems.forEach(n=> n.classList.toggle('active', n===item));
    const tab = item.dataset.tab;

      document.getElementById(tabOverlays[tab]).classList.add('visible');
    }
  });
});

/* =====================================================================
   RIPPLE — effet tactile générique
   ===================================================================== */
function triggerRipple(e, el){
  const rect = el.getBoundingClientRect();
  const span = document.createElement('span');
  const size = Math.max(rect.width, rect.height);
  span.className = 'ripple-span';
  span.style.width = span.style.height = size+'px';
  const x = (e.clientX ?? rect.left+rect.width/2) - rect.left - size/2;
  const y = (e.clientY ?? rect.top+rect.height/2) - rect.top - size/2;
  span.style.left = x+'px'; span.style.top = y+'px';
  el.style.position = el.style.position || 'relative';
  el.style.overflow = 'hidden';
  el.appendChild(span);
  span.addEventListener('animationend', ()=> span.remove());
}
document.querySelectorAll('.zoom-btn, .toggle-btn, .add-device-btn, .nav-item').forEach(el=>{
  el.addEventListener('click', (e)=> triggerRipple(e, el));
});

/* =====================================================================
   BOTTOM SHEET — glissement (drag) fluide
   ===================================================================== */
const sheet = document.getElementById('bottomSheet');
const dragZone = document.getElementById('sheetDragZone');

const SHEET_HEIGHT = () => sheet.offsetHeight;
const PEEK = 250; // hauteur visible en position repliée
let collapsedY = 0;
let currentY = 0;
let dragStartY = 0;
let dragStartTranslate = 0;
let dragging = false;

function computeCollapsed(){
  collapsedY = Math.max(SHEET_HEIGHT() - PEEK, 0);
  return collapsedY;
}

function setSheetY(y, animate=true){
  currentY = Math.min(Math.max(y, 0), computeCollapsed());
  sheet.style.setProperty('--sheet-y', currentY+'px');
}

window.addEventListener('load', ()=>{ computeCollapsed(); setSheetY(collapsedY); });
window.addEventListener('resize', ()=>{ computeCollapsed(); setSheetY(currentY); });

function pointerDown(e){
  dragging = true;
  sheet.classList.add('is-dragging');
  dragStartY = (e.touches ? e.touches[0].clientY : e.clientY);
  dragStartTranslate = currentY;
}
function pointerMove(e){
  if(!dragging) return;
  const y = (e.touches ? e.touches[0].clientY : e.clientY);
  const delta = y - dragStartY;
  setSheetY(dragStartTranslate + delta);
}
function pointerUp(){
  if(!dragging) return;
  dragging = false;
  sheet.classList.remove('is-dragging');
  const collapsed = computeCollapsed();
  const shouldExpand = currentY < collapsed * 0.55;
  setSheetY(shouldExpand ? 0 : collapsed);
}

dragZone.addEventListener('mousedown', pointerDown);
window.addEventListener('mousemove', pointerMove);
window.addEventListener('mouseup', pointerUp);
dragZone.addEventListener('touchstart', pointerDown, {passive:true});
window.addEventListener('touchmove', pointerMove, {passive:true});
window.addEventListener('touchend', pointerUp);

/* Toucher un dispositif dans la liste replie légèrement le sheet pour voir la carte */
deviceList.addEventListener('click', (e)=>{
  if(e.target.closest('.device-card')){
    computeCollapsed();
    setSheetY(collapsedY);
  }
});
</script>
